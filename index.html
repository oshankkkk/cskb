<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Portfolio</title>
  <meta
    name="description"
    content="A minimal terminal-inspired portfolio that renders directly from README.md."
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <article id="readme-root" class="markdown-output" aria-live="polite">
      <p>Loading README.md...</p>
    </article>
  </main>

  <noscript>
    <p class="no-script">
      This site needs JavaScript enabled because it renders directly from <code>README.md</code>.
    </p>
  </noscript>

  <script type="module" src="script.js"></script>
</body>
</html>
